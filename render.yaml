services:
  - type: web
    name: trihealth-livedesk-updates
    runtime: static
    repo: https://github.com/jggranzotto-wq/trihealth-livedesk-updates
    branch: main
    buildCommand: "true"
    staticPublishPath: ./public
    headers:
      - path: /*
        name: Cache-Control
        value: "no-store, no-cache, must-revalidate, max-age=0"
      - path: /positions.json
        name: Cache-Control
        value: "no-store, no-cache, must-revalidate, max-age=0"
      - path: /version.json
        name: Cache-Control
        value: "no-store, no-cache, must-revalidate, max-age=0"
      - path: /scan.json
        name: Cache-Control
        value: "no-store, no-cache, must-revalidate, max-age=0"
